<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container">
    <div class="page-header">
        <h1>Productos</h1>
        <a th:href="@{/productos/nuevo}" class="btn btn-primary">+ Nuevo producto</a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="card table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="6" class="empty">No hay productos registrados</td>
            </tr>
            <tr th:each="p : ${productos}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.nombre}">Nombre</td>
                <td th:text="${p.descripcion}">Descripción</td>
                <td th:text="${'$' + #numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                <td th:text="${p.stock}">0</td>
                <td class="actions">
                    <a th:href="@{/productos/{id}/editar(id=${p.id})}" class="btn btn-secondary">Editar</a>
                    <form th:action="@{/productos/{id}/eliminar(id=${p.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar este producto?');">
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
