<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container narrow">
    <h1 th:text="${titulo}">Producto</h1>

    <form th:action="@{${accion}}" th:object="${producto}" method="post" class="card" novalidate>
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" th:field="*{nombre}" th:classappend="${#fields.hasErrors('nombre')} ? 'invalid'">
        <small class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" rows="3" th:field="*{descripcion}" th:classappend="${#fields.hasErrors('descripcion')} ? 'invalid'"></textarea>
        <small class="field-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></small>

        <label for="precio">Precio</label>
        <input id="precio" type="number" step="0.01" min="0" th:field="*{precio}" th:classappend="${#fields.hasErrors('precio')} ? 'invalid'">
        <small class="field-error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></small>

        <label for="stock">Stock</label>
        <input id="stock" type="number" step="1" min="0" th:field="*{stock}" th:classappend="${#fields.hasErrors('stock')} ? 'invalid'">
        <small class="field-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></small>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
