<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="center">
<main class="card login-card">
    <h1>Iniciar sesión</h1>

    <div th:if="${param.error}" class="alert alert-error">Usuario o contraseña incorrectos</div>
    <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada correctamente</div>

    <form th:action="@{/login}" method="post">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>

    <p class="hint">Usuario de prueba: <strong>admin</strong> / <strong>admin123</strong></p>
</main>
</body>
</html>
